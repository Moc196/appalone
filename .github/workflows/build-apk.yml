name: Build and Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      - name: Decode Keystore
        run: tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore

      - name: Build Debug APK
        run: |
          gradle assembleDebug > build_error.log 2>&1 || {
            git config user.email "moc196@example.com"
            git config user.name "Moc196"
            git add build_error.log
            git commit -m "ci: commit build error log"
            git push origin main
            exit 1
          }

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
